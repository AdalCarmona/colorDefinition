<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Proyecto de Definición de Colores</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./src/css/styles.css">
    </head>
    <body>
        <header>
            <h1>Sistema de Colores</h1>
        </header>
        <main>
            <form id="solicitud-datos">
                <label id="color-nombre" for="color-entrada">Seleccion de Color:</label>
                <input 
                    type="text" 
                    id="color-entrada" 
                    placeholder="Numero o nombre del color" required>

                <fieldset>
                    <legend>Selecciona presentacion:</legend>
                    <label><input type="radio" name="presentacion" value="cubeta">Cubeta</label>
                    <label><input type="radio" name="presentacion" value="galon">Galon</label>
                    <label><input type="radio" name="presentacion" value="litro">Litro</label>
                </fieldset>

                <button type="submit" id="buscar">Buscar</button>
            </form>

            <section id="resultado">
                <h2>Combinación de Tintas:</h2>

                <div id="color-info">
                    <div class="info-line">
                        <span class="info-label">Color:</span>
                        <span id="color-name"></span>

                        <span class="info-label">Código:</span>
                        <span id="color-code"></span>
                    </div>

                    <div class="info-line">
                        <span class="info-label">Base:</span>
                        <span id="color-base"></span>

                        <span class="info-label">Presentación:</span>
                        <span id="color-presentation"></span>
                    </div>
                </div>

                <table class="tabla-datos">
                    <thead>
                        <tr>
                            <th>Tinta</th>
                            <th>oz</th>
                            <th>64</th>
                            <th>128</th>
                        </tr>
                    </thead>

                    <tbody id="tabla-tintas"></tbody>
                </table>
                <div id="color-info-error"></div>
            </section>
        </main>
        <script src="./src/js/app.js"></script>

</html>
